<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0E13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="TeslaTrace — your car, your data, one glance." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TeslaTrace</title>
    <script>
      /* Runs before the first paint. Without it the shell renders dark and then
         flips to light, which reads as a bug on every reload. */
      (function () {
        try {
          var saved = localStorage.getItem("teslatrace.theme");
          var dark =
            saved === "dark" || saved === "light"
              ? saved === "dark"
              : !window.matchMedia("(prefers-color-scheme: light)").matches;
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0A0E13" : "#EFF2F5");
        } catch (error) {
          /* Private mode with storage disabled: the dark default is fine. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
