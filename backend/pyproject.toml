[project]
name = "teslatrace"
version = "0.1.0-alpha"
description = "Self-hosted, mobile-first dashboard for TeslaMate data"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "psycopg[binary,pool]==3.2.*",
    "aiomqtt==2.3.*",
    "sse-starlette==2.1.*",
    "orjson==3.10.*",
    "pydantic-settings==2.6.*",
    # Needed by SettingsConfigDict(env_file=".env"): without it a local .env is
    # silently ignored, which reads as "my password is wrong".
    "python-dotenv==1.*",
]

[project.optional-dependencies]
dev = ["pytest==8.*", "pytest-asyncio==0.24.*", "httpx==0.27.*", "sqlglot==25.*", "ruff==0.7.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["sql/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
